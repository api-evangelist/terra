name: Terra
description: >-
  Terra Security operates an agentic-AI-powered continuous offensive security
  (penetration testing) platform. Founded in 2024 and based in Tel Aviv, Terra
  runs a swarm of AI agents with a human-on-the-loop workflow that continuously
  validates every attack surface — web and internal applications, external and
  internal networks, and AI systems such as LLMs, copilots, MCP servers, and
  autonomous agents (AI red teaming). The platform compresses multi-week legacy
  pentests into hours, produces verified (low-noise) findings, and generates
  audit-ready evidence for SOC 2, ISO 27001, and HIPAA programs. Terra raised a
  $30M Series A led by Felicis in 2025. Terra publishes no public developer API;
  this profile captures the company's public web surface and security posture.
